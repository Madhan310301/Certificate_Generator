kind = "web"
previewPath = "/"
title = "Certificate Generator"
description = "A single-purpose, client-side certificate generator for event attendees. Enter a name, render it onto a fixed certificate template, preview the result, and download it as an image without accounts, storage, or a backend."
version = "1.0.0"
id = "artifacts/certificate-generator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22190

[services.development]
run = "pnpm --filter @workspace/certificate-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/certificate-generator", "run", "build" ]
serve = "static"
publicDir = "artifacts/certificate-generator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22190"
BASE_PATH = "/"
